name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Node the app is developed and tested against. `engines` in package.json
  # holds the wider range that is supported; `@types/node` follows this major.
  NODE_VERSION: '24.x'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before setup-node: the npm cache path is resolved by asking pnpm for its
      # store, so pnpm has to be on PATH first. No `version` here — it comes from
      # the `packageManager` field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each check runs even when an earlier one failed, so a single run reports
      # everything that needs fixing rather than the first thing.
      - name: Format (oxfmt --check)
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Lint (oxlint --deny-warnings)
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Typecheck (tsc, both projects)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build:portable` runs `build` first, so this covers both the Vite build
      # and the single-file bundling in scripts/make-portable.mjs.
      - name: Build dist/ and the portable single file
        run: pnpm run build:portable

      - name: Check dist/repaint.html was written
        run: test -s dist/repaint.html

      - name: Upload dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14
